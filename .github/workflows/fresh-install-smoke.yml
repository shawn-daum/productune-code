# T-021 (v0.5 C1) — fresh-install CI smoke. T-311: retargeted off the legacy
# installer; T-293: legacy tree removed, prdt installer renamed to its canonical
# `packages/core/scripts/install.sh`, and check (d) (dispatch-cost-strip) retired
# with the legacy post-bash-strip-cost hook it drove.
#
# Current checks (all in an isolated $HOME where relevant):
#   (a) install.sh smoke        — non-interactive prdt install wires mirror hooks,
#                                 prdt-* agents, and settings.json registration
#   (b) check-symlink-targets.sh — block absolute-path symlink targets (generic)
#
# Out of scope: full e2e GUI CI.

name: fresh-install-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: this job only reads the checkout.
permissions:
  contents: read

jobs:
  fresh-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Symlink lint (check b) inspects git-tracked blobs; no submodules needed.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure jq + python3 present
        # jq + python3 are preinstalled on ubuntu-latest; assert them so a runner
        # image change surfaces loudly instead of silently skewing the checks.
        # install.sh (check a) requires both.
        run: |
          jq --version
          python3 --version

      - name: Make CI check scripts executable
        run: chmod +x scripts/ci/*.sh

      # ── (b) absolute-path symlink target lint ──────────────────────────────
      # Run first: it is the cheapest static check and pins the first of the two
      # real fresh-install bugs (absolute-path symlink) from the deferred
      # candidate v0.5-fresh-install-ci-smoke.
      - name: (b) Lint symlink targets
        run: bash scripts/ci/check-symlink-targets.sh

      # ── (a) non-interactive prdt install in an isolated $HOME ──────────────
      # install.sh is non-interactive by design (no claude/auth preflight; needs
      # only jq + python3), so no stubs are required. Runs it in a throwaway
      # $HOME, then asserts the go-forward install invariants: the 3 discipline
      # hooks mirror to ~/.prdt/hooks, the prdt-* persona agents install into
      # ~/.claude/agents, and ~/.claude/settings.json is valid JSON registering
      # all 3 hooks.
      - name: (a) Non-interactive prdt-install smoke (isolated HOME)
        run: |
          set -euo pipefail
          SMOKE_HOME="$(mktemp -d "${RUNNER_TEMP:-/tmp}/prdt-install-smoke.XXXXXX")"
          HOME="$SMOKE_HOME" bash packages/core/scripts/install.sh < /dev/null

          fail=0
          bad() { printf 'FAIL: %s\n' "$*" >&2; fail=1; }

          for h in prdt-session-start.sh prdt-post-compact.sh prdt-post-dispatch.sh; do
            [ -f "$SMOKE_HOME/.prdt/hooks/$h" ] || bad "discipline hook not mirrored: $h"
          done
          for a in prdt-po prdt-designer prdt-developer prdt-qa; do
            [ -f "$SMOKE_HOME/.claude/agents/$a.md" ] || bad "persona agent not installed: $a.md"
          done
          settings="$SMOKE_HOME/.claude/settings.json"
          if ! jq -e . "$settings" >/dev/null 2>&1; then
            bad "settings.json is not valid JSON"
          else
            for h in prdt-session-start.sh prdt-post-compact.sh prdt-post-dispatch.sh; do
              jq -e --arg h "$h" '[.. | strings | select(endswith($h + "\""))] | length > 0' "$settings" >/dev/null \
                || bad "settings.json missing $h registration"
            done
          fi
          [ -f "$SMOKE_HOME/.prdt/prdt.env" ] || bad "prdt.env not seeded"

          rm -rf "$SMOKE_HOME"
          if [ "$fail" -ne 0 ]; then
            printf '\n[prdt-install-smoke] FAIL — prdt install invariant(s) violated.\n' >&2
            exit 1
          fi
          printf '[prdt-install-smoke] OK — non-interactive prdt install passed.\n'
