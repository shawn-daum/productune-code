# electron-builder config — T-020 (B4) unsigned macOS .dmg distribution.
#
# Layout note (vite-plugin-electron/simple):
#   - main process  → dist-electron/main.js   (BrowserWindow.main entry)
#   - preload       → dist-electron/preload.js
#   - renderer      → dist/index.html + dist/assets/**
#   package.json `main` = "dist-electron/main.js", so dist-electron/ MUST keep its
#   path inside the asar (entry-point lookup is literal). main.ts then loads the
#   renderer via `path.join(__dirname, '../renderer/index.html')` → relative to
#   dist-electron/ that is `<asar-root>/renderer/index.html`. So we map vite's
#   `dist/` output to a top-level `renderer/` dir and keep `dist-electron/` as-is.
#
# Unsigned by design: no `identity`, no notarization, no `afterSign` hook.
# Teammates open the app once via right-click → Open (see README Gatekeeper note).
appId: com.productune.gui
productName: Productune
# package.json `version` is 0.0.0 (workspace placeholder, consumed by other tooling
# so left untouched). extraMetadata overrides only the package.json copied into the
# asar, giving a real version for the artifact name + CFBundleVersion/ShortVersion.
extraMetadata:
  version: 0.5.0

# T-440: stages Resources/toolchain/npm with a dereferencing copy — see the
# extraResources note below for why this cannot be an extraResources entry.
afterPack: scripts/after-pack-toolchain.cjs

# T-442: pin the fuse state EXPLICITLY. The participant toolchain (toolchain.ts)
# is the app binary under ELECTRON_RUN_AS_NODE — with runAsNode disabled that
# env var is INERT and a toolchain spawn boots a full GUI instance instead of
# node (the 2026-07-30 runaway class; main.ts's launch guard now makes such an
# instance exit immediately, but the fuse must still never be flipped off by a
# future hardening template). resetAdHocDarwinSignature keeps the unsigned
# (adhoc-signed) arm64 binary launchable after the fuse write.
electronFuses:
  runAsNode: true
  resetAdHocDarwinSignature: true

directories:
  output: release
  buildResources: build

# Only the built output goes into the app; map vite's split dirs into the
# layout main.ts expects at runtime.
files:
  - from: dist-electron
    to: dist-electron
    filter:
      - "**/*"
  - from: dist
    to: renderer
    filter:
      - "**/*"
  - package.json

# T-PATCH-177: ship the menu-bar Tray PNGs. `build/` is buildResources and is NOT
# in `files`, so it is never bundled into the asar. electron/tray.ts loads these
# at runtime, so they are copied as an unpacked extraResource to
# <app>/Contents/Resources/build/tray/ — exactly the process.resourcesPath
# fallback resolveTrayIcon() probes in packaged builds.
extraResources:
  - from: build/tray
    to: build/tray
    filter:
      - "**/*"
  # T-431: the prdt INSTALLER PAYLOAD — everything install.sh §1/§3 mirrors home,
  # bundled unpacked (never in the asar: bin/prdt must be spawnable and the hook
  # .sh files are copied byte-for-byte to ~/.prdt) so a participant machine with
  # no ~/.prdt is provisioned by the app itself on first launch
  # (electron/prdt-bootstrap.ts reads this at <Resources>/prdt-core). This is a
  # DIFFERENT contract from the removed T-PATCH-217 `../core` copy (which shipped
  # the raw source tree for legacy onboarding to read at runtime): prdt-core is
  # a copy SOURCE only — nothing reads it after bootstrap, and hooks/settings
  # keep pointing at the ~/.prdt mirror per the A1 install-level boundary
  # (never at the app bundle).
  - from: ../core
    to: prdt-core
    filter:
      - "doctrine.md"
      - "discipline/**"
      - "agents/prdt-*.md"
      - "scripts/prdt"
      - "scripts/statusline-prdt.sh"
      - "scripts/hook-manifest.json"
      - "scripts/install.sh"
      - "scripts/hooks/prdt-*.sh"
  # T-440: the JS TOOLCHAIN PAYLOAD (Resources/toolchain/npm — the pure-JS `npm`
  # package, executed under the app's own Electron-as-Node runtime; see
  # electron/toolchain.ts) is NOT an extraResources entry: electron-builder's
  # file matcher structurally drops `node_modules` dirs from extraResources
  # copies (verified on a real `--mac dir` build, even with an explicit
  # `node_modules/**` include — payload came out 932K instead of ~16M, missing
  # npm's bundled deps). It is staged by the afterPack hook at the top of this
  # file with a dereferencing fs.cpSync instead, which also resolves the pnpm
  # store symlink.
  # T-311: the `../core` → Resources/core extraResource (T-PATCH-217) is GONE.
  # Its sole runtime consumer was the legacy GUI onboarding, which readdir'd
  # `app.getAppPath()/../core/agents` to symlink pdt-* specs, copied
  # `core/po/po-instructions.md`, and read `core/scripts/hooks/*.sh` for the 18
  # legacy enforcement hooks. That flow was downgraded to read-only in T-311 —
  # nothing under Resources/core is read at runtime anymore (prdt onboarding uses
  # the ~/.prdt mirror written by install.sh (packages/core/scripts), not the app bundle; the only
  # residual `coreDir` use is the vestigial PRODUCTUNE_REPO string in
  # productune.env, which is never stat'd). @productune/core is still bundled as a
  # normal workspace dependency inside the asar — this only drops the raw source
  # tree copy. NOTE: verify on a packaged .dmg (dist:mac) — this loop can't build one.

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Unsigned: skip signing + notarization entirely. `identity: null` tells
  # electron-builder not to attempt to discover a signing identity.
  identity: null

dmg:
  title: "${productName} ${version}"
