# electron-builder config — T-020 (B4) unsigned macOS .dmg distribution.
#
# Layout note (vite-plugin-electron/simple):
#   - main process  → dist-electron/main.js   (BrowserWindow.main entry)
#   - preload       → dist-electron/preload.js
#   - renderer      → dist/index.html + dist/assets/**
#   package.json `main` = "dist-electron/main.js", so dist-electron/ MUST keep its
#   path inside the asar (entry-point lookup is literal). main.ts then loads the
#   renderer via `path.join(__dirname, '../renderer/index.html')` → relative to
#   dist-electron/ that is `<asar-root>/renderer/index.html`. So we map vite's
#   `dist/` output to a top-level `renderer/` dir and keep `dist-electron/` as-is.
#
# Unsigned by design: no `identity`, no notarization, no `afterSign` hook.
# Teammates open the app once via right-click → Open (see README Gatekeeper note).
appId: com.productune.gui
productName: Productune
# package.json `version` is 0.0.0 (workspace placeholder, consumed by other tooling
# so left untouched). extraMetadata overrides only the package.json copied into the
# asar, giving a real version for the artifact name + CFBundleVersion/ShortVersion.
extraMetadata:
  version: 0.5.0

directories:
  output: release
  buildResources: build

# Only the built output goes into the app; map vite's split dirs into the
# layout main.ts expects at runtime.
files:
  - from: dist-electron
    to: dist-electron
    filter:
      - "**/*"
  - from: dist
    to: renderer
    filter:
      - "**/*"
  - package.json

# T-PATCH-177: ship the menu-bar Tray PNGs. `build/` is buildResources and is NOT
# in `files`, so it is never bundled into the asar. electron/tray.ts loads these
# at runtime, so they are copied as an unpacked extraResource to
# <app>/Contents/Resources/build/tray/ — exactly the process.resourcesPath
# fallback resolveTrayIcon() probes in packaged builds.
extraResources:
  - from: build/tray
    to: build/tray
    filter:
      - "**/*"
  # T-PATCH-217: bundle packages/core (doctrine · agents · config · skills) to
  # <app>/Contents/Resources/core. onboarding.ts resolves coreDir as
  # `app.getAppPath()/../core` = Resources/app.asar/../core = Resources/core, and
  # the setup step readdir's core/agents (unguarded). Without this the packaged
  # app's onboarding fails with ENOENT. Exclude build/dev-only weight.
  - from: ../core
    to: core
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!.turbo/**"
      - "!dist/**"
      - "!src/**"
      - "!test/**"
      - "!**/.DS_Store"
      - "!tsconfig.json"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Unsigned: skip signing + notarization entirely. `identity: null` tells
  # electron-builder not to attempt to discover a signing identity.
  identity: null

dmg:
  title: "${productName} ${version}"
